<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Map</title>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --accent:#1a73e8; --border:#d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --accent:#4c8df6; --border:#30363d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  #status { flex: 1; min-width: 200px; font-size: 14px; color: var(--muted); }
  button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #map { flex: 1; }
  body.dragging #map { outline: 3px dashed var(--accent); outline-offset: -8px; }
  /* Info windows always render on a white background, so keep their text dark. */
  .info { max-width: 260px; font-size: 13px; line-height: 1.4; color: #1f2328; }
  .info img { display: block; width: 100%; border-radius: 4px; margin-bottom: 6px; }
  .info a { color: #1a73e8; }
</style>
</head>
<body>
<header>
  <h1>Photo Map</h1>
  <span id="status">Loading…</span>
  <button id="pick" disabled>Choose photos</button>
  <button id="pickdir" class="secondary" disabled>Choose folder</button>
  <button id="drive" class="secondary" hidden>From Google Drive</button>
  <button id="clear" class="secondary" hidden>Clear</button>
  <input id="files" type="file" multiple accept="image/*,.heic,.heif" hidden>
  <input id="dir" type="file" webkitdirectory hidden>
</header>
<div id="map"></div>

<script>
// ─── Configuration: fill these in (see README.md) ────────────────────────────
const CONFIG = {
  MAPS_API_KEY: 'AIzaSyCvo3GbOM0ffpEa4oRobOCEMsD_B63bTdo',
  MAP_ID:       'DEMO_MAP_ID', // fine for a prototype; create a real Map ID later
  // Optional "From Google Drive" button. It stays hidden until OAUTH_CLIENT_ID is filled in.
  OAUTH_CLIENT_ID: '673202376182-pfrjnrn0q7r5biv6l5qhb8n9h19p28k1.apps.googleusercontent.com',
  APP_ID:          '673202376182', // Cloud project number, required by the Picker
};
// ─────────────────────────────────────────────────────────────────────────────

// Photos are read in this browser only. Nothing is uploaded anywhere.
const EXIFR_URL   = 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js';
const CLUSTER_URL = 'https://unpkg.com/@googlemaps/markerclusterer@2.6.2/dist/index.min.js';
const IMAGE_EXT   = /\.(jpe?g|heic|heif|png|tiff?|webp|dng)$/i;
// drive.file only grants access to the files the user picks in the Picker.
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

const $ = (id) => document.getElementById(id);
const setStatus = (text) => { $('status').textContent = text; };

let map, infoWindow, clusterer;
let markers = [];
let photos = [];     // { file, name, lat, lng, time, url }
let checked = 0;
let busy = false;
let tokenClient, accessToken = null, tokenExpires = 0;

function setBusy(on) {
  busy = on;
  $('pick').disabled = $('pickdir').disabled = $('drive').disabled = on;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}

function loadGoogleMaps() {
  return new Promise((resolve, reject) => {
    window.__onMapsReady = resolve;
    window.gm_authFailure = () =>
      setStatus('Google Maps rejected the API key. Check the key and its website restriction (see README).');
    const params = new URLSearchParams({
      key: CONFIG.MAPS_API_KEY, v: 'weekly', libraries: 'marker',
      loading: 'async', callback: '__onMapsReady',
    });
    loadScript('https://maps.googleapis.com/maps/api/js?' + params).catch(reject);
  });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// exifr revives EXIF dates as local-time Date objects
function formatTime(d) {
  if (!(d instanceof Date) || isNaN(d)) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function init() {
  if (CONFIG.MAPS_API_KEY.startsWith('YOUR_')) {
    setStatus('Setup needed: add the Maps API key to CONFIG in index.html.');
    return;
  }
  try {
    await Promise.all([loadGoogleMaps(), loadScript(EXIFR_URL), loadScript(CLUSTER_URL)]);
  } catch (err) {
    setStatus(err.message);
    return;
  }

  map = new google.maps.Map($('map'), {
    center: { lat: 20, lng: 0 }, zoom: 2,
    mapId: CONFIG.MAP_ID, streetViewControl: false,
  });
  infoWindow = new google.maps.InfoWindow();

  $('pick').onclick = () => $('files').click();
  $('pickdir').onclick = () => $('dir').click();
  $('files').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  $('dir').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
  $('clear').onclick = clearAll;
  setupDragAndDrop();

  $('pick').disabled = false;
  $('pickdir').disabled = false;
  setStatus('Choose photos or a folder, or drop photos on the map. They stay on this device.');

  if (!CONFIG.OAUTH_CLIENT_ID.startsWith('YOUR_')) setupDrive();
}

// ─── Google Drive: Picker + drive.file ───────────────────────────────────────

async function setupDrive() {
  try {
    await Promise.all([
      loadScript('https://accounts.google.com/gsi/client'),
      loadScript('https://apis.google.com/js/api.js').then(() => new Promise((r) => gapi.load('picker', r))),
    ]);
  } catch (err) {
    console.warn('Google Drive option unavailable:', err.message);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.OAUTH_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: () => {}, // replaced per request in pickFromDrive
    error_callback: (err) => setStatus('Google sign-in did not finish (' + (err.type || 'unknown') + ').'),
  });
  $('drive').onclick = pickFromDrive;
  $('drive').hidden = false;
}

function pickFromDrive() {
  if (accessToken && Date.now() < tokenExpires) {
    showPicker();
    return;
  }
  tokenClient.callback = (resp) => {
    if (resp.error) {
      setStatus('Google sign-in failed: ' + resp.error);
      return;
    }
    accessToken = resp.access_token;
    tokenExpires = Date.now() + (resp.expires_in - 60) * 1000;
    showPicker();
  };
  tokenClient.requestAccessToken({ prompt: '' });
}

function showPicker() {
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES)
    .setIncludeFolders(true)
    .setSelectFolderEnabled(false)
    .setMode(google.picker.DocsViewMode.GRID);
  new google.picker.PickerBuilder()
    .setTitle('Choose photos to map')
    .addView(view)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setOAuthToken(accessToken)
    .setDeveloperKey(CONFIG.MAPS_API_KEY)
    .setAppId(CONFIG.APP_ID)
    .setCallback(onPicked)
    .build()
    .setVisible(true);
}

async function onPicked(data) {
  if (data.action !== google.picker.Action.PICKED || busy) return;
  const docs = data.docs || [];
  setBusy(true);
  const files = [];
  try {
    for (const [i, doc] of docs.entries()) {
      setStatus(`Downloading from Drive… ${i + 1} of ${docs.length}`);
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(doc.id)}?alt=media`, {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      if (res.status === 401) {
        accessToken = null;
        throw new Error('Your Google session expired. Click "From Google Drive" again.');
      }
      if (!res.ok) {
        console.warn('Drive download failed', doc.name, res.status);
        continue;
      }
      const file = new File([await res.blob()], doc.name, { type: doc.mimeType });
      file.driveUrl = doc.url;
      files.push(file);
    }
  } catch (err) {
    setStatus(err.message);
    setBusy(false);
    return;
  }
  setBusy(false);
  addFiles(files);
}

function setupDragAndDrop() {
  let depth = 0;
  document.addEventListener('dragenter', (e) => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    depth = 0;
    document.body.classList.remove('dragging');
    addFiles(e.dataTransfer.files);
  });
}

async function addFiles(fileList) {
  if (busy) return;
  const files = [...fileList].filter((f) => f.type.startsWith('image/') || IMAGE_EXT.test(f.name));
  if (!files.length) {
    setStatus('No photos in that selection.');
    return;
  }
  setBusy(true);

  for (const file of files) {
    checked++;
    try {
      const exif = await exifr.parse(file, { gps: true, exif: true, ifd0: false, ifd1: false });
      const lat = exif?.latitude, lng = exif?.longitude;
      if (Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)) {
        photos.push({ file, name: file.name, lat, lng, time: exif.DateTimeOriginal || exif.CreateDate,
                      driveUrl: file.driveUrl, url: null });
      }
    } catch {
      // Unreadable or EXIF-less file: it counts as checked, without a location.
    }
    if (checked % 10 === 0) setStatus(`Reading… ${checked} photos checked, ${photos.length} with a location`);
  }

  plot();
  setStatus(photos.length
    ? `${photos.length} of ${checked} photos have a location.`
    : `None of the ${checked} photos have location data to plot.`);
  $('clear').hidden = false;
  setBusy(false);
}

function plot() {
  if (clusterer) clusterer.clearMarkers();
  markers.forEach((m) => { m.map = null; });

  const bounds = new google.maps.LatLngBounds();
  markers = photos.map((p) => {
    const position = { lat: p.lat, lng: p.lng };
    bounds.extend(position);
    const marker = new google.maps.marker.AdvancedMarkerElement({ position, title: p.name, gmpClickable: true });
    marker.addEventListener('gmp-click', () => openInfo(p, marker));
    return marker;
  });

  clusterer = new markerClusterer.MarkerClusterer({ map, markers });

  if (photos.length === 1) {
    map.setCenter(bounds.getCenter());
    map.setZoom(14);
  } else if (photos.length > 1) {
    map.fitBounds(bounds, 40);
  }
}

function openInfo(p, marker) {
  if (!p.url) p.url = URL.createObjectURL(p.file);
  const when = formatTime(p.time);
  const coords = `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
  const div = document.createElement('div');
  div.className = 'info';
  div.innerHTML = `<img alt="">
    <strong>${escapeHtml(p.name)}</strong>
    ${when ? `<br>${escapeHtml(when)}` : ''}
    <br><a href="https://www.google.com/maps/search/?api=1&query=${coords}" target="_blank" rel="noopener">Open in Google Maps</a>
    ${p.driveUrl ? `<br><a href="${escapeHtml(p.driveUrl)}" target="_blank" rel="noopener">Open in Google Drive</a>` : ''}`;

  // Most browsers other than Safari can't show HEIC, so fall back to the
  // JPEG thumbnail embedded in the EXIF, and drop the image if that fails too.
  const img = div.querySelector('img');
  let triedThumb = false;
  img.onerror = async () => {
    if (triedThumb) { img.remove(); return; }
    triedThumb = true;
    try {
      const thumb = await exifr.thumbnailUrl(p.file);
      if (thumb) img.src = thumb; else img.remove();
    } catch {
      img.remove();
    }
  };
  img.src = p.url;

  infoWindow.setContent(div);
  infoWindow.open({ map, anchor: marker });
}

function clearAll() {
  if (infoWindow) infoWindow.close();
  if (clusterer) clusterer.clearMarkers();
  markers.forEach((m) => { m.map = null; });
  photos.forEach((p) => { if (p.url) URL.revokeObjectURL(p.url); });
  markers = [];
  photos = [];
  checked = 0;
  $('clear').hidden = true;
  setStatus('Cleared. Choose photos or a folder, or drop photos on the map.');
}

init();
</script>
</body>
</html>
